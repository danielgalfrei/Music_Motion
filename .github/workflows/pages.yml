name: Publicar en Github Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # actualiza noticias y listas cada 30 minutos
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Conserva traducciones y portadas entre ejecuciones
      - uses: actions/cache@v4
        with:
          path: |
            data/translations.json
            data/covers.json
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: node build-static.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Motion</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#16161a; --muted:#6b6b76; --line:#e4e2dc; --accent:#c8321e; --hover:#f0eee9 }
  :root[data-theme="dark"] { --bg:#101013; --card:#1a1a1f; --ink:#ececf0; --muted:#9a9aa6; --line:#2a2a31; --accent:#ff6b4a; --hover:#23232a }
  * { box-sizing:border-box }
  [hidden] { display:none !important }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; transition:background .2s,color .2s }
  header { border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5 }
  .wrap { max-width:900px; margin:0 auto; padding:0 16px }
  .top { display:flex; align-items:center; gap:12px; padding:12px 0 }
  .brand { display:flex; align-items:center; gap:12px }
  h1 { font-size:20px; margin:0; letter-spacing:-.02em; white-space:nowrap } h1 span { color:var(--accent) }
  .icon { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:50%; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex:none }
  .icon:hover { background:var(--hover) } .icon svg { width:18px; height:18px }
  #sun { display:none } :root[data-theme="dark"] #sun { display:block } :root[data-theme="dark"] #moon { display:none }
  .right { margin-left:auto; display:flex; align-items:center; gap:8px; min-width:0 }
  .search { display:flex; align-items:center; gap:6px; min-width:0 }
  #q { width:0; opacity:0; padding:0; border:0; transition:width .2s,opacity .2s,padding .2s; background:var(--card); color:var(--ink); font:inherit; border-radius:18px; height:36px }
  .search.open #q { width:min(240px,45vw); opacity:1; padding:0 14px; border:1px solid var(--line) }
  .upd { color:var(--muted); font-size:12px; white-space:nowrap }
  button.ref { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer }
  .tabs { display:flex; gap:4px; overflow-x:auto }
  .tab { border:0; background:none; color:var(--muted); font:inherit; font-weight:600; padding:10px 16px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap }
  .tab.on { color:var(--ink); border-color:var(--accent) }
  .sub { display:flex; gap:8px; flex-wrap:wrap; padding:14px 0 4px; align-items:center }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:99px; overflow:hidden; background:var(--card) }
  .seg button { border:0; background:none; color:var(--muted); font:inherit; font-size:14px; font-weight:600; padding:6px 16px; cursor:pointer }
  .seg button.on { background:var(--ink); color:var(--bg) }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:8px 0 }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:4px 12px; font:inherit; font-size:13px; cursor:pointer }
  .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink) }
  main { padding:12px 0 48px }
  .hint { color:var(--muted); font-size:13px; margin:0 0 12px }
  article { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px }
  .meta { display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted); margin-bottom:6px; flex-wrap:wrap }
  .cat { color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.05em }
  .tag { border:1px solid var(--line); border-radius:99px; padding:0 8px; font-size:11px }
  article h2 { font-size:18px; line-height:1.3; margin:0 0 6px }
  article h2 a { color:inherit; text-decoration:none } article h2 a:hover { text-decoration:underline }
  article p { margin:0 0 10px; color:var(--muted); font-size:14.5px }
  .src { font-size:13px; border-top:1px dashed var(--line); padding-top:8px }
  .src a { color:var(--accent) }
  .empty { text-align:center; color:var(--muted); padding:48px 0 }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:14.5px }
  th, td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--line) }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600 }
  tr:last-child td { border-bottom:0 }
  td.l, th.l { text-align:left } td.pos { width:44px; font-weight:700; text-align:center } th.pos { width:44px; text-align:center }
  td small { display:block; color:var(--muted); font-size:12.5px }
  .up { color:#1f9d55 } .down { color:#d64545 }
  .table-wrap { overflow-x:auto }
  .srcline { color:var(--muted); font-size:12.5px; margin-top:10px }
  .srcline a { color:var(--accent) }
  .who { display:flex; align-items:center; gap:10px; min-width:0 }
  .who > div { min-width:0 }
  .cv { width:44px; height:44px; border-radius:6px; object-fit:cover; background:var(--line); flex:none }
  .cv.art { border-radius:50% }
  .play { width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--accent); cursor:pointer; flex:none; display:inline-flex; align-items:center; justify-content:center; padding:0 }
  .play:hover { background:var(--accent); color:#fff; border-color:var(--accent) }
  .play svg { width:14px; height:14px; margin-left:2px }
  tr.now td { background:var(--hover) }
  #player { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--card); border-top:1px solid var(--line); padding:8px 16px; display:none }
  #player.on { display:block } body.has-player main { padding-bottom:120px }
  #player .in { max-width:900px; margin:0 auto; display:flex; align-items:center; gap:10px }
  #player .box { flex:1; min-width:0; height:80px } #player iframe { width:100%; height:80px; border:0 }
  .nowrap { white-space:nowrap }
  @media (max-width:560px) { .upd { display:none } h1 { font-size:18px } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <button class="icon" id="theme" title="Cambiar modo día / noche" aria-label="Cambiar modo día / noche">
          <svg id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <h1>Music <span>Motion</span></h1>
      </div>
      <div class="right">
        <span class="upd" id="upd">Cargando…</span>
        <button class="ref" id="ref">Actualizar</button>
        <div class="search" id="search">
          <input type="search" id="q" placeholder="Artista, sello, palabra clave…" aria-label="Buscar">
          <button class="icon" id="lupa" title="Buscar" aria-label="Buscar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="tabs" id="sections">
      <button class="tab on" data-s="news">Noticias</button>
      <button class="tab" data-s="streaming">Top streaming</button>
      <button class="tab" data-s="artists">Top artistas</button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="sub">
    <div class="seg" id="regions"><button class="on" data-r="es">España</button><button data-r="int">Internacional</button></div>
    <div class="seg" id="kinds" hidden><button class="on" data-k="songs">Top canciones</button><button data-k="artists">Top artistas</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <main id="list"></main>
</div>
<div id="player"><div class="in"><div class="box" id="box"></div><button class="icon" id="pclose" title="Cerrar reproductor" aria-label="Cerrar reproductor">✕</button></div></div>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script>
const CATS = ['Todas','Adquisiciones','Catálogos','Sellos','Fichajes','Lanzamientos','Mercado','General'];
const st = { section:'news', region:'es', kind:'songs', category:'' };
let charts = null, timer;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = n => (n ?? null) === null ? '—' : Number(n).toLocaleString('es-ES');
const fmt = d => new Date(d).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>';
const who = (uri, cover, art, title, sub) => `<div class="who">
  <button class="play" data-uri="${esc(uri)}" title="Reproducir" aria-label="Reproducir ${esc(title)}">${ICON_PLAY}</button>
  ${cover ? `<img class="cv${art ? ' art' : ''}" src="${esc(cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="cv${art ? ' art' : ''}"></div>`}
  <div><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div></div>`;
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

// ---- Tema día / noche ----
function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch {} }
(function () {
  let t; try { t = localStorage.getItem('theme'); } catch {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// ---- Lupa ----
$('lupa').onclick = () => {
  const s = $('search'); const open = s.classList.toggle('open');
  if (open) $('q').focus(); else { $('q').value = ''; render(); }
};
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(render, 200); };
$('q').onkeydown = e => { if (e.key === 'Escape') $('lupa').click(); };

// ---- Navegación ----
$('chips').innerHTML = CATS.map((c,i)=>`<button class="chip${i?'':' on'}" data-c="${i?c:''}">${c}</button>`).join('');
$('chips').onclick = e => { const b = e.target.closest('.chip'); if(!b) return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===b)); st.category=b.dataset.c; render(); };
function seg(id, key, attr) { $(id).onclick = e => { const b = e.target.closest('button'); if(!b) return;
  [...$(id).children].forEach(x=>x.classList.toggle('on', x===b)); st[key]=b.dataset[attr]; render(); }; }
seg('regions','region','r'); seg('kinds','kind','k');
$('sections').onclick = e => { const b = e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===b)); st.section=b.dataset.s; render(); };
$('ref').onclick = async () => { $('ref').disabled = true; $('upd').textContent='Actualizando…';
  try { await fetch('api/refresh',{method:'POST'}); } catch {}   // solo existe al ejecutar en local; en Github Pages basta con recargar los datos
  news = charts = null; $('ref').disabled=false; render(); };

// ---- Render ----
async function render() {
  $('kinds').hidden = st.section !== 'streaming';
  $('chips').hidden = st.section !== 'news';
  if (st.section === 'news') return renderNews();
  return renderCharts();
}

let news = null;
async function renderNews() {
  const q = $('q').value.trim();
  if (!news) {
    try { news = await (await fetch('api/news.json', { cache: 'no-cache' })).json(); }
    catch { $('list').innerHTML = '<div class="empty">No se han podido cargar las noticias. Inténtalo de nuevo en unos segundos.</div>'; return; }
  }
  // buscando: se busca en España e Internacional
  const n = q.toLowerCase();
  const found = news.items.filter(i =>
    (q ? `${i.title} ${i.originalTitle || ''} ${i.summary} ${i.source}`.toLowerCase().includes(n) : i.region === st.region) &&
    (!st.category || i.category === st.category));
  const r = { updatedAt: news.updatedAt, total: found.length, items: found.slice(0, 200) };
  $('upd').textContent = r.updatedAt ? 'Actualizado ' + fmt(r.updatedAt) : 'Cargando fuentes…';
  const hint = q ? `<p class="hint">${r.total} resultado(s) para «${esc(q)}» en España e Internacional.</p>` : '';
  $('list').innerHTML = hint + (r.items.length ? r.items.map(i => `
    <article>
      <div class="meta"><span class="cat">${esc(i.category)}</span><span>${fmt(i.date)}</span>
        ${q ? `<span class="tag">${i.region === 'es' ? 'España' : 'Internacional'}</span>` : ''}
        ${i.translated ? `<span class="tag" title="Original: ${esc(i.originalTitle)}">Traducido del inglés</span>` : ''}</div>
      <h2><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></h2>
      ${i.summary ? `<p>${esc(i.summary)}</p>` : ''}
      <div class="src">Fuente: <b>${esc(i.source)}</b> (${esc(i.sourceType)}) · <a href="${esc(i.url)}" target="_blank" rel="noopener">ver original ↗</a></div>
    </article>`).join('')
    : '<div class="empty">Sin resultados (si acabas de arrancar, espera unos segundos y pulsa Actualizar).</div>');
}

const move = m => m === '=' || !m ? '' : m === 'NEW' ? '<span class="up">nuevo</span>' : /^\+/.test(m) ? `<span class="up">▲${esc(m.slice(1))}</span>` : /^-/.test(m) ? `<span class="down">▼${esc(m.slice(1))}</span>` : esc(m);

async function renderCharts() {
  if (!charts) {
    $('list').innerHTML = '<div class="empty">Cargando listas…</div>';
    try { const res = await fetch('api/charts.json', { cache: 'no-cache' }); if (!res.ok) throw 0; charts = await res.json(); }
    catch { $('list').innerHTML = '<div class="empty">No se han podido cargar las listas. Inténtalo de nuevo en unos segundos.</div>'; return; }
  }
  $('upd').textContent = 'Listas ' + fmt(charts.updatedAt);
  // Las portadas se descargan en segundo plano la primera vez: reintentar un par de veces
  const lacking = [...charts.es.songs, ...charts.int.songs, ...charts.es.topArtists, ...charts.int.topArtists].some(x => !x.cover);
  if (lacking && (st.coverRetries = (st.coverRetries || 0) + 1) <= 4) setTimeout(() => { charts = null; if (st.section !== 'news') render(); }, 12000);
  const q = norm($('q').value.trim());
  const d = charts[st.region], reg = st.region === 'es' ? 'España' : 'Mundo';
  let html, note;
  if (st.section === 'streaming' && st.kind === 'songs') {
    const rows = d.songs.filter(s => !q || norm(s.title + ' ' + s.artistText).includes(q));
    note = `Top canciones · ${reg} · streams del último día en Spotify`;
    html = table(['#','Canción','Streams'], rows.map(s => `<tr><td class="pos">${s.pos}<small>${move(s.move)}</small></td><td class="l">${who('spotify:track:'+s.trackId, s.cover, false, s.title, s.artistText)}</td><td>${nf(s.streams)}</td></tr>`), [0,1]);
  } else if (st.section === 'streaming') {
    const rows = d.streamingArtists.filter(a => !q || norm(a.name).includes(q));
    note = `Top artistas · ${reg} · suma de streams del último día de todas sus canciones en la lista`;
    html = table(['#','Artista','Canciones en lista','Streams'], rows.map(a => `<tr><td class="pos">${a.pos}</td><td class="l">${who('spotify:artist:'+a.id, a.cover, true, a.name)}</td><td>${a.songs}</td><td>${nf(a.streams)}</td></tr>`), [0,1]);
  } else {
    const rows = d.topArtists.filter(a => !q || norm(a.name).includes(q));
    note = `Top artistas · ${reg} · streams de la última semana (lista semanal de Spotify) y oyentes mensuales`;
    html = table(['#','Artista','Streams semana','Canciones en lista','Oyentes mensuales'], rows.map(a => `<tr><td class="pos">${a.pos}</td><td class="l">${who('spotify:artist:'+a.id, a.cover, true, a.name)}</td><td>${nf(a.streams)}</td><td>${a.songs}</td><td>${nf(a.listeners)}</td></tr>`), [0,1]);
  }
  $('list').innerHTML = `<p class="hint">${note}</p>${html}
    <p class="srcline">Fuente: <b>${esc(charts.source.name)}</b> · <a href="https://kworb.net/spotify/country/${st.region === 'es' ? 'es' : 'global'}_${st.section === 'artists' ? 'weekly' : 'daily'}.html" target="_blank" rel="noopener">ver listas originales ↗</a></p>`;
}
function table(heads, rows, leftCols) {
  if (!rows.length) return '<div class="empty">Sin resultados.</div>';
  return `<div class="table-wrap"><table><thead><tr>${heads.map((h,i)=>`<th class="${i===0?'pos':leftCols.includes(i)?'l':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

// ---- Reproductor (Spotify iFrame API; sin sesión de Spotify suena un fragmento de 30 s) ----
let spotifyApi = null, controller = null, pendingUri = null, currentUri = null;
window.onSpotifyIframeApiReady = api => { spotifyApi = api; if (pendingUri) startPlayer(pendingUri); };
function markNow() { document.querySelectorAll('tr').forEach(tr => tr.classList.toggle('now', !!currentUri && tr.querySelector('.play')?.dataset.uri === currentUri)); }
function startPlayer(uri) {
  if (controller) { controller.loadUri(uri); setTimeout(() => controller.play(), 300); return; }
  const el = document.createElement('div'); $('box').innerHTML = ''; $('box').appendChild(el);
  spotifyApi.createController(el, { uri, width: '100%', height: 80 }, c => {
    controller = c;
    c.addListener('ready', () => c.play());
  });
}
function playUri(uri) {
  currentUri = uri; pendingUri = uri;
  $('player').classList.add('on'); document.body.classList.add('has-player'); markNow();
  if (spotifyApi) return startPlayer(uri);
  // API aún no cargada (o bloqueada): reproductor básico
  setTimeout(() => { if (!spotifyApi && pendingUri === uri) {
    const [, type, id] = uri.split(':');
    $('box').innerHTML = `<iframe src="https://open.spotify.com/embed/${type}/${id}" allow="autoplay; encrypted-media; clipboard-write" loading="lazy"></iframe>`; } }, 2500);
}
$('list').addEventListener('click', e => { const b = e.target.closest('.play'); if (b) playUri(b.dataset.uri); });
$('pclose').onclick = () => {
  if (controller) { try { controller.pause(); } catch {} controller.destroy?.(); controller = null; }
  $('box').innerHTML = ''; $('player').classList.remove('on'); document.body.classList.remove('has-player'); currentUri = pendingUri = null; markNow();
};
const _renderCharts = renderCharts;
renderCharts = async function () { await _renderCharts(); markNow(); };

render(); setInterval(() => { if (st.section === 'news' && !$('q').value) { news = null; renderNews(); } }, 5*60*1000);
</script>
</body>
</html>
